name: Android Unit Test CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      # 1. Lấy code về
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cache Gradle (cho nhanh)
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      # 4. Cấp quyền cho gradlew
      - name: Grant execute permission
        run: chmod +x gradlew

      # 5. Chạy Unit Test
      - name: Run Unit Tests
        run: ./gradlew test
