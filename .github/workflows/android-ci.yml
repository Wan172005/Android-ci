name: Android Test CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK (QUAN TRỌNG)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      # 5. Grant permission
      - name: Grant execute permission
        run: chmod +x gradlew

      # 6. Unit Test
      - name: Run Unit Tests
        run: ./gradlew test

      # 7. Restart ADB (sau khi có SDK)
      - name: Restart ADB
        run: |
          adb kill-server
          adb start-server

      # 8. UI Test
      - name: Run UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot-save
            -memory 2048
          emulator-boot-timeout: 600
          script: |
            ./gradlew assembleDebug assembleAndroidTest
            ./gradlew connectedAndroidTest
